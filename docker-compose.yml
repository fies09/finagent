services:
  # PostgreSQL 数据库
  finagent_postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: finagent-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finagent123}
      POSTGRES_DB: ${POSTGRES_DB:-finagent}
    volumes:
      - finagent_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finagent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - finagent-network

  # Redis 缓存
  finagent_redis:
    image: redis:7.2-alpine
    container_name: finagent-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis123}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - finagent_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD:-redis123} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - finagent-network

  # FinAgent 主服务
  finagent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finagent
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-finagent}:${POSTGRES_PASSWORD:-finagent123}@finagent_postgres:5432/${POSTGRES_DB:-finagent}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@finagent_redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    depends_on:
      finagent_postgres:
        condition: service_healthy
      finagent_redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finagent-network

volumes:
  finagent_postgres_data:
    driver: local
  finagent_redis_data:
    driver: local

networks:
  finagent-network:
    driver: bridge